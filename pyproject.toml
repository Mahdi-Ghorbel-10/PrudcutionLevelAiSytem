[project]
name = "rag-agent"
version = "0.1.0"
description = "Agentic RAG platform: LangGraph agent, hybrid retrieval, evals, and a production web stack."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic-settings>=2.5",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
