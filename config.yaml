# Tunables shared by every environment. Secrets and environment-specific values go in .env.
llm_timeout_seconds: 30

ingestion:
  chunk_size_chars: 800
  chunk_overlap_chars: 100
  # Prepend the heading path to the text that is embedded. B7 compares true and false.
  embed_with_heading: true
  chroma_path: data/chroma
  collection_name: chunks
  embedding_model: BAAI/bge-small-en-v1.5
  embed_batch_size: 32

retrieval:
  # dense | bm25 | hybrid | hybrid_rerank. B7 compares these without code changes.
  mode: hybrid_rerank
  dense_top_k: 20
  bm25_top_k: 20
  rrf_k: 60
  fused_top_k: 10
  rerank_top_k: 4
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
